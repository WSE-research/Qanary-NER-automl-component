# Builds the Qanary component image on pull requests that touch the backend,
# so a Dockerfile or requirements.txt change that breaks the image is caught
# before it reaches main (the Docker Push workflows only build after merging).
# The image is not pushed. A short smoke test starts the REST app in the
# built image and asks it for entities.
name: Docker build check

on:
  pull_request:
    paths:
      - "AutomationService/AutomationServiceBackend/**"
      - ".github/workflows/docker-build-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the CUDA base image and torch
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build the image (same build arguments as AutomationService/.env)
        run: |
          docker build -t ner-build-check \
            -f AutomationService/AutomationServiceBackend/DockerfileQanary \
            --build-arg TRAININGDATA=address_data.csv \
            --build-arg TESTDATA=address_validation_data.csv \
            --build-arg MODELTYPE=spacy \
            --build-arg LANGUAGE=en \
            AutomationService/AutomationServiceBackend
      - name: Smoke test the REST app in the image
        run: |
          docker run -d --name ner -p 8081:8081 ner-build-check \
            uvicorn app.main:app --host 0.0.0.0 --port 8081
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:8081/openapi.json && break
            sleep 2
          done
          curl -fsS "http://localhost:8081/api?text=My%20name%20is%20Marilyn%20Monroe" -o /tmp/result.json
          cat /tmp/result.json
          grep -q '"results"' /tmp/result.json
      - name: Container log
        if: always()
        run: docker logs ner || true
